services:
  # ----------------------------------------------------
  # Backend Flask API Web Service
  # ----------------------------------------------------
  - type: web
    name: fashion-classifier-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # ----------------------------------------------------
  # Frontend React (Vite) Static Site
  # ----------------------------------------------------
  - type: web
    name: fashion-classifier-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fashion-classifier-backend
          property: host
